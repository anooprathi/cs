# =====================================================================
# Common configuration — applies to every profile unless overridden by
# an application-{profile}.properties file.
#
# NOTE: there is deliberately no spring.profiles.active default here
# anymore. This used to say "dev" — meaning a plain `java -jar` with no
# arguments silently activated the least-secure configuration (H2
# console reachable, demo tenants seeded, their API keys printed to
# logs). A production review correctly called that a real blocker, not
# a convenience. RequiredProfileGuard (see that class) now refuses to
# start at all unless a profile is explicitly selected:
#   --spring.profiles.active=dev   (local development)
#   --spring.profiles.active=prod  (production — see application-prod.properties
#                                    for every environment variable that must
#                                    actually be set; it is NOT safe to run
#                                    with only this file's defaults)
# =====================================================================

spring.application.name=url-shortener

server.port=8080

# ---- Datasource / JPA (H2 in-memory, per assignment requirement) ----
# PRODUCTION NOTE: this is in-memory H2 — data is lost on every restart,
# and there is no override of it in application-prod.properties either.
# A real production deployment MUST override every spring.datasource.*
# property below to point at a real, persistent database (PostgreSQL is
# assumed throughout this project's documentation), and should run
# spring.jpa.hibernate.ddl-auto=validate against real Flyway/Liquibase
# migrations rather than ddl-auto=update — see README.md "Production
# Readiness Roadmap" for the full, honest list of what that would take.
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- App-specific ----
app.base-url=http://localhost:8080

# Optional external URL-safety check (Spring Cloud OpenFeign). Off by
# default so the service runs standalone with no external dependency.
app.url-safety-check.enabled=false
app.url-safety-check.base-url=http://localhost:9999

# Per-tenant rate limiting (noisy-neighbor protection), keyed by plan —
# see RateLimitProperties. Adding a new plan tier is purely config here
# (plus a RateLimitPlan enum constant) — no code in TenantRateLimiterService
# changes. See application-dev.properties / application-prod.properties
# for environment-specific tuning.
app.rate-limit.plans.standard.api-permits-per-minute=20
app.rate-limit.plans.standard.redirect-permits-per-minute=120
app.rate-limit.plans.premium.api-permits-per-minute=100
app.rate-limit.plans.premium.redirect-permits-per-minute=600

# Usage-based billing (metering + rating only — no payment is ever
# processed by this service; see BillingService Javadoc). Amounts are
# integer cents. STANDARD: small base fee, modest included quota.
# PREMIUM: higher base fee, generous included quota, cheaper overage.
app.billing.plans.standard.base-fee-cents=0
app.billing.plans.standard.included-api-calls=50
app.billing.plans.standard.included-redirects=500
app.billing.plans.standard.overage-api-call-cents=2
app.billing.plans.standard.overage-redirect-cents=1

app.billing.plans.premium.base-fee-cents=4900
app.billing.plans.premium.included-api-calls=1000
app.billing.plans.premium.included-redirects=20000
app.billing.plans.premium.overage-api-call-cents=1
app.billing.plans.premium.overage-redirect-cents=0

# Admin API (cross-tenant visibility/management — see AdminController).
# Deliberately blank here: with no hash configured, AdminAuthenticationFilter
# fails CLOSED — admin access is disabled entirely, not "any key works."
# In a real deployment, set this via an environment variable
# (APP_ADMIN_API_KEY_HASH) to the SHA-256 hex hash of a real secret, never
# committed in plaintext. See application-dev.properties for the local
# development default and its raw key.
app.admin.api-key-hash=

# ---- Feign (used only if app.url-safety-check.enabled=true) ----
feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=2000

# ---- Async (see AsyncConfig) ----
# True everywhere except the test profile, which overrides to false for
# deterministic test assertions — see AsyncConfig's Javadoc.
app.async.metering.enabled=true

# ---- Rate limiter backend (see ARCHITECTURE.md "Multi-Datacenter") ----
# "local": in-process Caffeine+Bucket4j buckets — correct for a single
#   instance, but each instance/DC enforces its own independent quota, so a
#   tenant's *effective* limit multiplies by however many instances are
#   running. Fine for local dev and this prototype's default.
# "redis": shared fixed-window counters in Redis (see RedisRateLimiterBackend)
#   — the actual state that needs to be centralized for multi-instance or
#   multi-DC deployments to enforce one true fair-share limit per tenant.
app.rate-limit.backend=local
# Only read when backend=redis. Point at a Redis endpoint reachable from
# every app instance/DC that must share this limiter state (e.g. a single
# regional Redis, or a cross-DC-replicated one — see ARCHITECTURE.md).
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
# Splits liveness ("is the process alive") from readiness ("can it serve
# traffic") — standard Kubernetes-style probe groups, so an orchestrator
# doesn't route traffic to an instance that's up but still starting/
# draining, without also killing it just because a downstream dependency
# blipped (which liveness alone conflating the two would risk).
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# The Redis starter is on the classpath unconditionally (needed for the
# optional RedisRateLimiterBackend — see app.rate-limit.backend below),
# which makes Spring Boot Actuator auto-register a health indicator that
# checks Redis reachability REGARDLESS of whether the app is actually
# configured to use it. A production review caught the real consequence:
# with the default "local" rate-limiter backend (no Redis in use at all),
# /actuator/health reported 503 because an irrelevant, unused dependency
# happened to be unreachable — a perfectly healthy app reporting itself
# unhealthy. Disabled by default to match that default; if
# app.rate-limit.backend is switched to "redis" in a given deployment,
# ALSO set this to true there, since at that point Redis genuinely is a
# real dependency worth alerting on.
management.health.redis.enabled=false

# ---- Observability: metrics + tracing ----
# Every metric this app emits gets a "service" tag, so multi-instance /
# multi-DC deployments distinguish sources in a shared metrics backend
# rather than instance-count or datacenter being invisible.
management.metrics.tags.service=url-shortener
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Zipkin export is OFF here in the base file (no active-profile default —
# see the top of this file) and each profile now decides for itself:
# application-dev.properties / application-test.properties re-exclude it
# (no real collector in local dev/test — exporting unconditionally to a
# default localhost endpoint with nothing listening produces nothing but
# failed-export log noise, a background AsyncReporter thread repeatedly
# getting Connection refused against http://localhost:9411/api/v2/spans).
# application-prod.properties leaves it enabled and points
# management.zipkin.tracing.endpoint at a real collector via env var — see
# that file.
#
# CORRECTNESS NOTE: an earlier attempt at this fix set
# management.zipkin.tracing.export.enabled=false, which does NOT exist as
# a real Spring Boot property — confirmed by decompiling
# spring-boot-actuator-autoconfigure-3.3.4.jar: ZipkinAutoConfiguration is
# gated only by @ConditionalOnClass(Encoding.class), with no
# @ConditionalOnProperty at all, and that property name appears nowhere in
# the module's spring-configuration-metadata.json. Spring Boot silently
# ignores unrecognized properties rather than erroring, so that line did
# nothing — the export attempts (and the log noise) continued regardless.
# The actual fix is excluding the autoconfiguration class outright, which
# is why this is a spring.autoconfigure.exclude entry per-profile rather
# than a plain property toggle.
#
# Sampling probability for distributed tracing spans, when export is
# enabled. 1.0 (trace everything) is fine at dev/test's traffic volume;
# application-prod.properties overrides this down to bound tracing
# overhead and backend storage cost at real QPS.
management.tracing.sampling.probability=1.0

# ---- OpenAPI / Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Logging ----
logging.level.com.schwab.urlshortener=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
