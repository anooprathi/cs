# =====================================================================
# dev profile — local development. Activate explicitly or leave as the
# default (see spring.profiles.active in application.properties).
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =====================================================================

# H2 console for poking at the in-memory DB directly during development.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true

# Two demo tenants (one STANDARD, one PREMIUM) are seeded at startup by
# DevDataSeeder, and their generated API keys are printed to the log —
# see the "How to Run" section of README.md for the exact log line to
# copy. This exists purely so you can start curl-ing immediately without
# first calling POST /api/v1/tenants yourself.
app.dev-seed.enabled=true

# Dev-only admin key — NEVER use this in a real deployment. Raw key:
#   admin-dev-only-key-change-me
# Send it in the X-Admin-Key header (not X-API-Key — that's for tenants).
# The value below is that raw key's SHA-256 hex hash (matches
# ApiKeyGenerator.hash), which is what actually gets compared — the raw
# key itself is never stored anywhere, dev or prod.
app.admin.api-key-hash=6457793c2b480899b78c0a86bafa0e7dc6510762b08112cf625804ffaa6c77f9

logging.level.com.schwab.urlshortener=DEBUG
logging.level.org.springframework.security=DEBUG
