# =====================================================================
# prod profile.
#   java -jar url-shortener.jar --spring.profiles.active=prod
#
# NOTE: this still points at the in-memory H2 DB per the assignment's
# "inbuilt H2 DB" requirement — state does not survive a restart, and
# this profile does NOT make H2 a real production datastore. In an
# actual production deployment, override spring.datasource.* (e.g. via
# environment variables) to point at Postgres/MySQL and add a Flyway/
# Liquibase migration set; that swap needs no application code changes
# since access is entirely through Spring Data JPA. This is called out
# as a limitation in ENGINEERING_SUMMARY.md, not hidden.
# =====================================================================

# H2 console must never be reachable outside local development.
spring.h2.console.enabled=false

spring.jpa.show-sql=false
app.dev-seed.enabled=false

# app.admin.api-key-hash is intentionally NOT set here either — it inherits
# the blank default from application.properties, so admin access stays
# fail-closed (disabled) until this is explicitly overridden, e.g. via the
# APP_ADMIN_API_KEY_HASH environment variable, with a real secret's
# SHA-256 hash generated for this deployment specifically. Never reuse the
# dev key/hash from application-dev.properties in production.

# Tighter, higher-volume plan limits for a production-shaped deployment
# (illustrative — tune against real capacity/load testing).
app.rate-limit.plans.standard.api-permits-per-minute=60
app.rate-limit.plans.standard.redirect-permits-per-minute=300
app.rate-limit.plans.premium.api-permits-per-minute=300
app.rate-limit.plans.premium.redirect-permits-per-minute=1500

# Multi-instance / multi-datacenter deployments MUST use the Redis backend —
# the local backend enforces limits per-instance, so a tenant's effective
# rate multiplies by however many instances/DCs are running behind it. See
# RedisRateLimiterBackend's Javadoc and ARCHITECTURE.md "Multi-Datacenter".
# A genuinely single-instance production deployment can leave this as
# "local" — only override to "redis" (and point spring.data.redis.* at a
# real, reachable Redis) once there's more than one instance to coordinate.
app.rate-limit.backend=local

# ---- HikariCP connection pool ----
# H2 in-memory doesn't meaningfully need pool tuning (no real network I/O
# to a remote DB), but these properties are what actually matter once
# spring.datasource.url is overridden to point at Postgres/MySQL — sized
# here so that swap is "change the URL," not "also go figure out pool
# sizing under load." Rule of thumb followed (from HikariCP's own sizing
# guidance, itself derived from PostgreSQL's formula): pool size ≈
# ((core_count * 2) + effective_spindle_count) for the DB, then the app
# side just needs enough headroom for genuinely concurrent in-flight
# queries at expected peak QPS — NOT "one connection per thread," which
# hugely over-provisions and just pushes contention onto the database
# instead of the app.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# Fail fast rather than let a request hang indefinitely waiting on a
# connection that will never free up in time to be useful to the caller.
spring.datasource.hikari.connection-timeout=5000
# Recycle connections periodically — guards against subtle issues with
# long-lived connections (stale state, DB-side idle timeouts closing the
# socket without Hikari's knowledge) that are easy to not notice until
# they cause a production incident under sustained load.
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=url-shortener-hikari

logging.level.com.schwab.urlshortener=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

management.endpoint.health.show-details=never
