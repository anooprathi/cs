# =====================================================================
# test profile — used by @ActiveProfiles("test") in integration tests.
# Each test class gets its own isolated H2 instance (random UUID in the
# JDBC URL) so tests never see another test class's data even when run
# in parallel.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:urlshortener-test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.base-url=http://localhost:8080
app.dev-seed.enabled=false
spring.h2.console.enabled=false

# Deliberately generous limits so ordinary integration tests don't trip
# the rate limiter; TenantRateLimiterServiceTest exercises exhaustion
# directly against the service, not through HTTP volume.
app.rate-limit.plans.standard.api-permits-per-minute=1000
app.rate-limit.plans.standard.redirect-permits-per-minute=1000
app.rate-limit.plans.premium.api-permits-per-minute=2000
app.rate-limit.plans.premium.redirect-permits-per-minute=2000

# Test-only admin key. Raw key: admin-test-key (used directly in
# integration tests via AdminAuthenticationFilter.ADMIN_KEY_HEADER).
app.admin.api-key-hash=0d46389428b4ebfa8757051ceae368473fc4b38a6e2a4ab0b70e0bf6b285fbf9

# Synchronous metering for tests — see AsyncConfig's Javadoc. Integration
# tests that create a link/hit a redirect and immediately assert on the
# resulting usage count would otherwise race the real async write.
app.async.metering.enabled=false
